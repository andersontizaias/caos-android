name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  validate:
    name: Validate before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run full check suite
        run: ./gradlew check --continue

  publish-maven-central:
    name: Publish caos-core & caos-compose to Maven Central
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Requires 4 secrets configured on the repo (Settings → Secrets and variables → Actions):
      #   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — token generated on the Central Portal
      #     (https://central.sonatype.com), namespace io.github.andersontizaias verified
      #   GPG_SIGNING_KEY / GPG_SIGNING_PASSWORD — in-memory GPG key (armored, no passphrase
      #     protecting the secret itself) used by signAllPublications() in the build.gradle.kts files
      - name: Publish to Maven Central
        run: >
          ./gradlew
          :caos-core:publishAndReleaseToMavenCentral
          :caos-compose:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

  github-release:
    name: Create GitHub Release with caos-lint and caos-sample artifacts
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build caos-lint fat jar and caos-sample debug APK
        run: ./gradlew :caos-lint:shadowJar :caos-sample:assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            caos-lint/build/libs/caos-lint-*-all.jar
            caos-sample/build/outputs/apk/debug/*.apk
